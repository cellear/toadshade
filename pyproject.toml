[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toadshade"
version = "0.1.0"
description = "The page bundle format: one page, one directory — prose in Markdown, structure in JSON, a double-clickable HTML preview."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Luke McCormick" }]
keywords = ["cms", "content", "migration", "static", "drupal", "data-liberation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]

# No required dependencies, on purpose: `toadshade render` and the structural
# half of `toadshade validate` are standard library only, so the tool runs from
# a bare checkout on any machine that has Python.
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
# Live Apple Notes extraction reuses Simon Willison's AppleScript driver
# rather than reimplementing it. Not needed to read a `--dump` file.
apple-notes = ["apple-notes-to-sqlite>=0.1"]
# Reading a Drupal site's MySQL/MariaDB database. A sqlite:/// URL needs nothing.
drupal = ["PyMySQL>=1.0"]
dev = ["jsonschema>=4.0", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/cellear/toadshade"
Specification = "https://github.com/cellear/toadshade/blob/main/SPEC.md"
"Reference importer" = "https://github.com/cellear/Drupal-Canvas-Page-Migrate"

[project.scripts]
toadshade = "toadshade.cli:main"
apple-notes-to-toadshade = "toadshade.importers.apple_notes:main"
drupal-to-toadshade = "toadshade.importers.drupal:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toadshade"]

# Ship the schema inside the wheel so `toadshade validate` finds it when
# installed, not just from a checkout.
[tool.hatch.build.targets.wheel.force-include]
"schema/bundle.schema.json" = "toadshade/schema/bundle.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src", "schema", "examples", "docs", "tests", "SPEC.md", "README.md", "LICENSE"]
# tests/fixtures carries the synthetic Apple Notes dump the exporter tests use.

[tool.pytest.ini_options]
testpaths = ["tests"]
